name: Offline Storage Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/offline-storage-test.yml'
      - 'android-template/**'
      - 'scripts/generate-app.py'
      - 'scripts/ci/offline-emulator.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout factory
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools emulator'

      - name: Install Android API 36
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create offline acceptance fixture
        run: |
          set -euo pipefail
          rm -rf offline-test generated-app
          mkdir -p offline-test
          cat > offline-test/manifest.json <<'JSON'
          {
            "appName": "Offline Storage Acceptance",
            "packageName": "com.castel.offlinetest",
            "versionName": "1.0.0",
            "versionCode": 1,
            "sourceType": "Uploaded HTML",
            "sourceMode": "html",
            "sourceFileName": "index.html",
            "offlineStorage": true,
            "autoUpdate": false,
            "cacheMode": "offline",
            "orientation": "portrait",
            "backNavigation": true,
            "zoom": false,
            "fullscreen": false,
            "externalLinks": false,
            "allowCleartext": true
          }
          JSON
          cat > offline-test/index.html <<'HTML'
          <!doctype html>
          <html><body>
          <h1>Offline storage acceptance</h1>
          <pre id="status">STARTING</pre>
          <script>
          const out = m => {
            document.getElementById('status').textContent += "\n" + m;
            console.log("OFFLINE_TEST:" + m);
          };
          function done(ok, err) {
            if (!ok) { out("DOWNLOAD_FAIL:" + err); return; }
            out("DOWNLOAD_OK");
            CastelApp.downloadBundle("http://10.0.2.2:8765/bundle.zip", "card-bundle", "", "bundleDone");
          }
          function verifyStored() {
            if (!window.CastelApp || !CastelApp.enabled()) { out("BRIDGE_DISABLED"); return; }
            if (!CastelApp.hasData("payload.txt")) { out("DATA_MISSING"); return; }
            const u = CastelApp.dataUrl("payload.txt");
            if (!u) { out("DATA_URL_MISSING"); return; }
            fetch(u).then(r => r.text()).then(t => {
              if (t !== "CASTEL_OFFLINE_PERSISTENCE_OK") { out("BAD_PAYLOAD:" + t); return; }
              const imageUrl = CastelApp.bundleUrl("card-bundle", "card.png");
              const rulingUrl = CastelApp.bundleUrl("card-bundle", "ruling.txt");
              if (!imageUrl || !rulingUrl) { out("BUNDLE_URL_MISSING"); return; }
              const img = new Image();
              img.onload = () => fetch(rulingUrl).then(r => r.text()).then(rt => {
                if (rt === "CASTEL_OFFLINE_RULING_OK") out("OFFLINE_PERSISTENCE_PASS");
                else out("BAD_RULING:" + rt);
              }).catch(e => out("RULING_FETCH_FAIL:" + e));
              img.onerror = () => out("IMAGE_LOAD_FAIL");
              img.src = imageUrl;
            }).catch(e => out("OFFLINE_FETCH_FAIL:" + e));
          }
          function bundleDone(ok, err) {
            if (!ok) { out("BUNDLE_DOWNLOAD_FAIL:" + err); return; }
            out("BUNDLE_DOWNLOAD_OK");
            verifyStored();
          }
          if (!CastelApp.hasData("payload.txt")) {
            out("DOWNLOAD_PHASE");
            CastelApp.downloadData("http://10.0.2.2:8765/payload.txt", "payload.txt", "done");
          } else if (!CastelApp.bundleUrl("card-bundle", "card.png")) {
            out("BUNDLE_DOWNLOAD_PHASE");
            CastelApp.downloadBundle("http://10.0.2.2:8765/bundle.zip", "card-bundle", "", "bundleDone");
          } else {
            out("VERIFY_PHASE");
            verifyStored();
          }
          </script></body></html>
          HTML
          mkdir -p offline-test/server/bundle
          printf 'CASTEL_OFFLINE_PERSISTENCE_OK' > offline-test/server/payload.txt
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > offline-test/server/bundle/card.png
          printf 'CASTEL_OFFLINE_RULING_OK' > offline-test/server/bundle/ruling.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path("offline-test/server/bundle")
          with zipfile.ZipFile("offline-test/server/bundle.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob("*"):
                  if p.is_file():
                      z.write(p, p.relative_to(root).as_posix())
          PY

      - name: Generate acceptance APK
        env:
          BUILD_MANIFEST: offline-test/manifest.json
          BUILD_OUTPUT: generated-app
          SOURCE_FILE: offline-test/index.html
          ICON_FILE: ''
        run: |
          set -euo pipefail
          python3 scripts/generate-app.py
          test -f generated-app/app/src/main/assets/index.html
          grep -F 'OFFLINE_STORAGE = true' generated-app/app/src/main/java/com/castel/offlinetest/MainActivity.java
          grep -F 'LOAD_CACHE_ELSE_NETWORK' generated-app/app/src/main/java/com/castel/offlinetest/MainActivity.java

      - name: Build acceptance APK
        run: |
          set -euo pipefail
          gradle -p generated-app assembleDebug --no-daemon --stacktrace
          test -s generated-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true
      - name: Runtime offline persistence acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: '-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save'
          emulator-boot-timeout: 900
          script: bash scripts/ci/offline-emulator.sh
