name: Verify Android Template

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Show source revision
        run: git rev-parse HEAD
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Run generator acceptance smoke tests
        run: |
          set -euo pipefail
          python3 scripts/smoke-test-generator.py
      - name: Validate template and build debug APK + release AAB
        run: |
          set -euo pipefail
          gradle --version
          gradle -p android-template lintDebug assembleDebug bundleRelease --no-daemon --stacktrace
      - name: Verify expected artifacts
        run: |
          set -euo pipefail
          APK="android-template/app/build/outputs/apk/debug/app-debug.apk"
          AAB="android-template/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          sha256sum "$APK" "$AAB"
      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: castel-template-verification
          if-no-files-found: error
          path: |
            android-template/app/build/outputs/apk/debug/app-debug.apk
            android-template/app/build/outputs/bundle/release/app-release.aab
            android-template/app/build/reports/lint-results-debug.html
