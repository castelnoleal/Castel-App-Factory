name: Build Cards Test APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'test-inputs/cards-site.json'
      - 'test-inputs/local-html.json'
      - 'test-inputs/sample-site/**'
      - 'scripts/generate-app.py'
      - 'scripts/smoke-test-generator.py'
      - 'android-template/**'
      - '.github/workflows/build-cards-test.yml'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Show source revision
        run: git rev-parse HEAD
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Generate Cards Android project
        shell: bash
        run: |
          set -euo pipefail
          BUILD_MANIFEST="$GITHUB_WORKSPACE/test-inputs/cards-site.json" \
          BUILD_OUTPUT="$GITHUB_WORKSPACE/build/cards" \
          SOURCE_BASE64="" \
          python3 scripts/generate-app.py
      - name: Verify generated website target
        shell: bash
        run: |
          set -euo pipefail
          MAIN="build/cards/app/src/main/java/org/meiocg/cards/MainActivity.java"
          test -s "$MAIN"
          grep -F 'webView.loadUrl("https://cards.meiocg.org/");' "$MAIN"
          ! grep -F 'webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");' "$MAIN"
      - name: Build Cards APK and AAB
        shell: bash
        run: gradle -p build/cards lintDebug assembleDebug bundleRelease --no-daemon --stacktrace
      - name: Verify Cards artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="build/cards/app/build/outputs/apk/debug/app-debug.apk"
          AAB="build/cards/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          sha256sum "$APK" "$AAB"
      - name: Publish latest test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="build/cards/app/build/outputs/apk/debug/app-debug.apk"
          AAB="build/cards/app/build/outputs/bundle/release/app-release.aab"
          if gh release view cards-test-latest >/dev/null 2>&1; then
            gh release upload cards-test-latest "$APK#MEIOCG-Cards-test.apk" "$AAB#MEIOCG-Cards-test.aab" --clobber
          else
            gh release create cards-test-latest "$APK#MEIOCG-Cards-test.apk" "$AAB#MEIOCG-Cards-test.aab" --title "MEIOCG Cards Test Build" --notes "Automated acceptance build generated from https://cards.meiocg.org/" --prerelease
          fi
      - name: Upload Cards artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meiocg-cards-test-apk-aab
          if-no-files-found: error
          path: |
            build/cards/app/build/outputs/apk/debug/app-debug.apk
            build/cards/app/build/outputs/bundle/release/app-release.aab

  generic-local-source-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Show source revision
        run: git rev-parse HEAD
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Generate and build standalone HTML
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BASE64="$(base64 -w0 test-inputs/sample-site/index.html)" \
          BUILD_MANIFEST="$GITHUB_WORKSPACE/test-inputs/local-html.json" \
          BUILD_OUTPUT="$GITHUB_WORKSPACE/build/local-html" \
          python3 scripts/generate-app.py
          MAIN="build/local-html/app/src/main/java/com/castel/localtest/MainActivity.java"
          grep -F 'webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");' "$MAIN"
          test -s build/local-html/app/src/main/assets/index.html
          gradle -p build/local-html lintDebug assembleDebug bundleRelease --no-daemon --stacktrace
          unzip -t build/local-html/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -t build/local-html/app/build/outputs/bundle/release/app-release.aab >/dev/null
          unzip -l build/local-html/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'
      - name: Generate and build ZIP website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/zip-input
          cp -R test-inputs/sample-site/. build/zip-input/
          (cd build/zip-input && zip -qr ../sample-site.zip .)
          python3 - <<'PY'
          import json
          d=json.load(open('test-inputs/local-html.json'))
          d['appName']='Factory ZIP Test'
          d['packageName']='com.castel.ziptest'
          d['sourceFileName']='sample-site.zip'
          open('build/zip-manifest.json','w').write(json.dumps(d))
          PY
          SOURCE_BASE64="$(base64 -w0 build/sample-site.zip)" \
          BUILD_MANIFEST="$GITHUB_WORKSPACE/build/zip-manifest.json" \
          BUILD_OUTPUT="$GITHUB_WORKSPACE/build/local-zip" \
          python3 scripts/generate-app.py
          MAIN="build/local-zip/app/src/main/java/com/castel/ziptest/MainActivity.java"
          grep -F 'webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");' "$MAIN"
          test -s build/local-zip/app/src/main/assets/index.html
          test -s build/local-zip/app/src/main/assets/style.css
          gradle -p build/local-zip lintDebug assembleDebug bundleRelease --no-daemon --stacktrace
          unzip -t build/local-zip/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -t build/local-zip/app/build/outputs/bundle/release/app-release.aab >/dev/null
          unzip -l build/local-zip/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/style.css'
      - name: Upload generic acceptance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generic-html-zip-acceptance
          if-no-files-found: error
          path: |
            build/local-html/app/build/outputs/apk/debug/app-debug.apk
            build/local-html/app/build/outputs/bundle/release/app-release.aab
            build/local-zip/app/build/outputs/apk/debug/app-debug.apk
            build/local-zip/app/build/outputs/bundle/release/app-release.aab
