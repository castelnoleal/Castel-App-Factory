name: Repair Build Workflow YAML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Repair invalid step names
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build-app.yml')
          s = p.read_text()
          replacements = {
              '- name: Update stage: generating Android project': '- name: "Update stage: generating Android project"',
              '- name: Update stage: compiling APK and AAB': '- name: "Update stage: compiling APK and AAB"',
              '- name: Update stage: runtime smoke test': '- name: "Update stage: runtime smoke test"',
              '- name: Update stage: verifying artifacts': '- name: "Update stage: verifying artifacts"',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY
          grep -n 'Update stage:' .github/workflows/build-app.yml
      - name: Commit repair
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/build-app.yml; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-app.yml
          git commit -m 'Fix build workflow YAML syntax'
          git push origin HEAD:main
