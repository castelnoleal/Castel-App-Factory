name: Diagnose Failed Build

on:
  workflow_run:
    workflows: ["Build Generated App"]
    types: [completed]
    branches: [main]

# This workflow is intentionally read-only. It must never push repairs to
# production automatically; review and test fixes on the sandbox first.
permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect failed build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/failed.log || true
          echo "Failed workflow: $RUN_ID"
          echo "Actionable failure signatures:"
          grep -Ein 'error:|failed|failure|timed out|not found|missing|PAGE_ERROR|FATAL EXCEPTION' /tmp/failed.log | tail -n 100 || true
          echo
          echo "No files are modified and no commits are pushed by this diagnostic workflow."
