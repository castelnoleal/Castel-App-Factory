name: Deploy Castel Build Bridge

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-build-bridge.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Cloudflare Worker
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
      - name: Fail if Cloudflare credentials are missing
        if: steps.credentials.outputs.configured != 'true'
        run: |
          echo 'Cloudflare deployment cannot continue because CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID is not configured.'
          exit 1
      - name: Verify deployed build bridge
        if: steps.credentials.outputs.configured == 'true'
        run: |
          set -euo pipefail
          sleep 5
          body=$(curl --fail --silent --show-error --retry 3 https://api.castelmei.com/health)
          echo "$body"
          echo "$body" | grep -q '"status":"online"'
          echo "$body" | grep -q '"revision":"website-source-v2"'
