# Checks Synapse's numpy/C# model port against the real ygo-agent JAX model.
name: Synapse model check
on:
  push:
    branches: [synapse-android]
    paths: ["model-check/**", ".github/workflows/synapse-model-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: JAX + ygo-agent (versions the released model was trained with)
        run: |
          pip install -q numpy==1.26.4 jax==0.4.28 jaxlib==0.4.28 flax==0.8.5 optax==0.2.2 chex==0.1.86 \
            distrax==0.1.5 tensorflow-probability==0.24.0 msgpack
          git clone -q https://github.com/sbl1996/ygo-agent.git ygo-agent
          git -C ygo-agent checkout -q dd4af63
          curl -sSL -o ckpt.flax_model https://github.com/sbl1996/ygo-agent/releases/download/v0.1/0546_22750M.flax_model
      - name: Compare
        run: |
          set -o pipefail
          PYTHONPATH=ygo-agent python model-check/tools/check_np_model.py --ckpt ckpt.flax_model \
            --obs model-check/obs.npz --out jax_ref.npz | tee result.txt
          while read -r line; do echo "::notice title=model check::$line"; done < result.txt
      - name: Report failure
        if: failure()
        run: tail -30 result.txt 2>/dev/null | while read -r line; do echo "::error title=model check::$line"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jax-reference
          path: jax_ref.npz
