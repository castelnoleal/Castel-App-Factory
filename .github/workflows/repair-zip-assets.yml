name: Repair ZIP Asset Handling

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair generator and smoke test
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/generate-app.py')
          s = p.read_text()
          marker = '# ZIP-ASSET-FIX'
          if marker not in s:
              old = "    assets = output / \"app\" / \"src\" / \"main\" / \"assets\"\n    assets.mkdir(parents=True, exist_ok=True)\n"
              new = "    assets = output / \"app\" / \"src\" / \"main\" / \"assets\"\n    assets.mkdir(parents=True, exist_ok=True)\n    # ZIP-ASSET-FIX: remove template web assets before importing uploaded site content.\n    if not web_source:\n        for child in list(assets.iterdir()):\n            if child.is_dir():\n                shutil.rmtree(child)\n            else:\n                child.unlink()\n"
              if old not in s:
                  raise SystemExit('generator insertion point not found')
              s = s.replace(old, new, 1)
              p.write_text(s)

          p = Path('scripts/smoke-test-generator.py')
          s = p.read_text()
          marker = 'ZIP-ASSET-SMOKE-FIX'
          if marker not in s:
              old = '            assert "Smoke" in index.read_text(encoding="utf-8")\n'
              new = '            assert "Smoke" in index.read_text(encoding="utf-8")\n            if source_name.endswith(".zip"):\n                assert (output / "app" / "src" / "main" / "assets" / "app.js").exists()\n            # ZIP-ASSET-SMOKE-FIX\n'
              if old not in s:
                  raise SystemExit('smoke test insertion point not found')
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY

      - name: Commit repaired files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-app.py scripts/smoke-test-generator.py
          if git diff --cached --quiet; then
            echo 'No repair needed.'
            exit 0
          fi
          git commit -m 'Fix uploaded ZIP web asset handling'
          git push
