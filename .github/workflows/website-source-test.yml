name: Website and Local Source Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'test-inputs/website-site.json'
      - 'test-inputs/local-html.json'
      - 'test-inputs/sample-site/**'
      - 'scripts/generate-app.py'
      - 'scripts/smoke-test-generator.py'
      - 'android-template/**'
      - '.github/workflows/website-source-test.yml'
      - 'scripts/ci/website-emulator.sh'
  pull_request:
    paths:
      - 'test-inputs/website-site.json'
      - 'test-inputs/local-html.json'
      - 'test-inputs/sample-site/**'
      - 'scripts/generate-app.py'
      - 'scripts/smoke-test-generator.py'
      - 'android-template/**'
      - '.github/workflows/website-source-test.yml'
      - 'scripts/ci/website-emulator.sh'

permissions:
  contents: write
  actions: read

jobs:
  website-source-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Show source revision
        run: git rev-parse HEAD
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Generate website-mode Android project
        shell: bash
        run: |
          set -euo pipefail
          BUILD_MANIFEST="$GITHUB_WORKSPACE/test-inputs/website-site.json" \
          BUILD_OUTPUT="$GITHUB_WORKSPACE/build/website" \
          SOURCE_BASE64="" \
          python3 scripts/generate-app.py
      - name: Verify generated website target
        shell: bash
        run: |
          set -euo pipefail
          MAIN="build/website/app/src/main/java/com/instapped/websitetest/MainActivity.java"
          test -s "$MAIN"
          grep -F 'webView.loadUrl("http://10.0.2.2:8080/")' "$MAIN"
          ! grep -F 'webView.loadUrl("https://appassets.androidplatform.net/assets/index.html")' "$MAIN"
      - name: Build website-mode APK and AAB
        shell: bash
        run: gradle -p build/website lintDebug assembleDebug bundleRelease --no-daemon --stacktrace
      - name: Verify website-mode artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="build/website/app/build/outputs/apk/debug/app-debug.apk"
          AAB="build/website/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          sha256sum "$APK" "$AAB"
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true
      - name: Runtime launch test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 900
          script: bash scripts/ci/website-emulator.sh

  generic-local-source-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Show source revision
        run: git rev-parse HEAD
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Generate and build standalone HTML
        shell: bash
        run: |
          set -euo pipefail
          # The generator consumes uploaded local files through SOURCE_FILE.
          SOURCE_FILE="$GITHUB_WORKSPACE/test-inputs/sample-site/index.html" \
          BUILD_MANIFEST="$GITHUB_WORKSPACE/test-inputs/local-html.json" \
          BUILD_OUTPUT="$GITHUB_WORKSPACE/build/local-html" \
          python3 scripts/generate-app.py
          MAIN="build/local-html/app/src/main/java/com/instapped/localtest/MainActivity.java"
          grep -F 'START_URL = "https://appassets.androidplatform.net/";' "$MAIN"
          test -s build/local-html/app/src/main/assets/index.html
          gradle -p build/local-html lintDebug assembleDebug bundleRelease --no-daemon --stacktrace
          unzip -t build/local-html/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -t build/local-html/app/build/outputs/bundle/release/app-release.aab >/dev/null
          unzip -l build/local-html/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'
      - name: Generate and build ZIP website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/zip-input
          cp -R test-inputs/sample-site/. build/zip-input/
          (cd build/zip-input && zip -qr ../sample-site.zip .)
          python3 - <<'PY'
          import json
          d=json.load(open('test-inputs/local-html.json'))
          d['appName']='Factory ZIP Test'
          d['packageName']='com.castel.ziptest'
          d['sourceFileName']='sample-site.zip'
          open('build/zip-manifest.json','w').write(json.dumps(d))
          PY
          # Match the ZIP filename in the manifest; generator reads bytes from SOURCE_FILE.
          SOURCE_FILE="$GITHUB_WORKSPACE/build/sample-site.zip" \
          BUILD_MANIFEST="$GITHUB_WORKSPACE/build/zip-manifest.json" \
          BUILD_OUTPUT="$GITHUB_WORKSPACE/build/local-zip" \
          python3 scripts/generate-app.py
          MAIN="build/local-zip/app/src/main/java/com/castel/ziptest/MainActivity.java"
          grep -F 'START_URL = "https://appassets.androidplatform.net/";' "$MAIN"
          test -s build/local-zip/app/src/main/assets/index.html
          test -s build/local-zip/app/src/main/assets/style.css
          gradle -p build/local-zip lintDebug assembleDebug bundleRelease --no-daemon --stacktrace
          unzip -t build/local-zip/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -t build/local-zip/app/build/outputs/bundle/release/app-release.aab >/dev/null
          unzip -l build/local-zip/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/style.css'
      - name: Upload generic acceptance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generic-html-zip-acceptance
          if-no-files-found: error
          # Files also live in the build's release; keep this copy briefly so it doesn't use Actions storage.
          retention-days: 1
          path: |
            build/local-html/app/build/outputs/apk/debug/app-debug.apk
            build/local-html/app/build/outputs/bundle/release/app-release.aab
            build/local-zip/app/build/outputs/apk/debug/app-debug.apk
            build/local-zip/app/build/outputs/bundle/release/app-release.aab
