name: Build Generated App

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Build ID stored under build-inputs/<id>
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout factory
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Show source revision
        run: git rev-parse HEAD
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Fetch build manifest and source chunks
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          mkdir -p "build-inputs/${BUILD_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/manifest.json?ref=main" --jq .content | tr -d '\n' | base64 -d > "build-inputs/${BUILD_ID}/manifest.json"
          chunk_count=$(jq -r '.sourceChunkCount // 0' "build-inputs/${BUILD_ID}/manifest.json")
          : > "build-inputs/${BUILD_ID}/source.bin"
          if [ "$chunk_count" -gt 0 ]; then
            for ((i=0; i<chunk_count; i++)); do
              name=$(printf 'source-%04d.bin' "$i")
              gh api "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/${name}?ref=main" --jq .content | tr -d '\n' | base64 -d >> "build-inputs/${BUILD_ID}/source.bin"
            done
          fi
      - name: Mark build running
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json?ref=main" --jq .sha)
          payload=$(jq -n --arg id "$BUILD_ID" --argjson runId "$GITHUB_RUN_ID" --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{buildId:$id,status:"running",runId:$runId,runUrl:$runUrl,updatedAt:(now|todateiso8601)}' | base64 -w0)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json" -f message="Mark build $BUILD_ID running" -f content="$payload" -f sha="$sha" -f branch=main >/dev/null
      - name: Generate Android project
        env:
          BUILD_ID: ${{ inputs.build_id }}
          BUILD_MANIFEST: build-inputs/${{ inputs.build_id }}/manifest.json
          BUILD_OUTPUT: generated-app
          SOURCE_BASE64: ''
        run: |
          set -euo pipefail
          if test -s "build-inputs/${BUILD_ID}/source.bin"; then export SOURCE_BASE64="$(base64 -w0 "build-inputs/${BUILD_ID}/source.bin")"; fi
          python3 scripts/generate-app.py
      - name: Validate generated project
        run: |
          set -euo pipefail
          test -f generated-app/settings.gradle
          test -f generated-app/app/build.gradle
          test -f generated-app/app/src/main/AndroidManifest.xml
          find generated-app/app/src/main/java -name MainActivity.java -print -quit | grep -q MainActivity.java
          if grep -R -n 'com.castel.generatedapp' generated-app/app/src/main/java; then echo 'Template package leaked into generated source'; exit 1; fi
          if ! grep -R -n "applicationId '$(jq -r .packageName build-inputs/${BUILD_ID}/manifest.json)'" generated-app/app/build.gradle; then echo 'Generated applicationId does not match manifest'; exit 1; fi
      - name: Verify website target for HTTPS builds
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          source_type=$(jq -r '.sourceType // ""' "build-inputs/${BUILD_ID}/manifest.json")
          if [ "$source_type" = "HTTPS website" ]; then
            url=$(jq -r '.sourceUrl // ""' "build-inputs/${BUILD_ID}/manifest.json")
            test -n "$url"
            grep -R -F "webView.loadUrl(\"${url}\");" generated-app/app/src/main/java >/dev/null
            if grep -R -F 'webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");' generated-app/app/src/main/java >/dev/null; then echo 'HTTPS build still points at local template asset'; exit 1; fi
          else
            test -s generated-app/app/src/main/assets/index.html
          fi
      - name: Lint and build debug APK + release AAB
        run: |
          set -euo pipefail
          gradle -p generated-app lintDebug assembleDebug bundleRelease --no-daemon --stacktrace
      - name: Verify artifacts
        run: |
          set -euo pipefail
          APK=generated-app/app/build/outputs/apk/debug/app-debug.apk
          AAB=generated-app/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          sha256sum "$APK" "$AAB"
      - name: Upload generated artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_id }}
          if-no-files-found: error
          path: |
            generated-app/app/build/outputs/apk/debug/app-debug.apk
            generated-app/app/build/outputs/bundle/release/app-release.aab
            generated-app/app/build/reports/lint-results-debug.html
      - name: Publish test build to public release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          if [ "$(jq -r '.testBuild // false' "build-inputs/${BUILD_ID}/manifest.json")" != "true" ]; then exit 0; fi
          if ! gh release view test-latest >/dev/null 2>&1; then
            gh release create test-latest --target main --title "Castel App Factory Test APK" --notes "Latest installable test APK generated by Castel App Factory."
          fi
          cp generated-app/app/build/outputs/apk/debug/app-debug.apk generated-app/app/build/outputs/apk/debug/Castel-App-Factory-Test.apk
          cp generated-app/app/build/outputs/bundle/release/app-release.aab generated-app/app/build/outputs/bundle/release/Castel-App-Factory-Test.aab
          gh release upload test-latest generated-app/app/build/outputs/apk/debug/Castel-App-Factory-Test.apk generated-app/app/build/outputs/bundle/release/Castel-App-Factory-Test.aab --clobber
      - name: Publish individual build release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          tag="build-${BUILD_ID}"
          gh release create "$tag" --target main --title "Castel App Factory Build ${BUILD_ID}" --notes "Generated by Castel App Factory." generated-app/app/build/outputs/apk/debug/app-debug.apk#app-debug.apk generated-app/app/build/outputs/bundle/release/app-release.aab#app-release.aab
      - name: Mark build successful with direct download metadata
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          artifact_name="app-${BUILD_ID}"
          artifact=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq --arg name "$artifact_name" '.artifacts | map(select(.name == $name)) | .[0]')
          artifact_id=$(echo "$artifact" | jq -r '.id')
          test "$artifact_id" != "null"
          artifact_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${artifact_id}"
          build_apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/build-${BUILD_ID}/app-debug.apk"
          build_aab_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/build-${BUILD_ID}/app-release.aab"
          test_build=$(jq -r '.testBuild // false' "build-inputs/${BUILD_ID}/manifest.json")
          test_apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/test-latest/Castel-App-Factory-Test.apk"
          test_aab_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/test-latest/Castel-App-Factory-Test.aab"
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json?ref=main" --jq .sha)
          payload=$(jq -n --arg id "$BUILD_ID" --argjson runId "$GITHUB_RUN_ID" --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg artifactUrl "$artifact_url" --arg buildApkUrl "$build_apk_url" --arg buildAabUrl "$build_aab_url" --argjson artifactId "$artifact_id" --arg testApkUrl "$test_apk_url" --arg testAabUrl "$test_aab_url" --argjson testBuild "$test_build" '{buildId:$id,status:"success",runId:$runId,runUrl:$runUrl,artifactId:$artifactId,artifactUrl:$artifactUrl,buildApkUrl:$buildApkUrl,buildAabUrl:$buildAabUrl,testBuild:$testBuild,testApkUrl:(if $testBuild then $testApkUrl else null end),testAabUrl:(if $testBuild then $testAabUrl else null end),apk:"app-debug.apk",aab:"app-release.aab",updatedAt:(now|todateiso8601)}' | base64 -w0)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json" -f message="Build $BUILD_ID succeeded" -f content="$payload" -f sha="$sha" -f branch=main >/dev/null
      - name: Mark build failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json?ref=main" --jq .sha || true)
          if [ -n "$sha" ]; then
            payload=$(jq -n --arg id "$BUILD_ID" --argjson runId "$GITHUB_RUN_ID" --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{buildId:$id,status:"failed",runId:$runId,runUrl:$runUrl,updatedAt:(now|todateiso8601)}' | base64 -w0)
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json" -f message="Build $BUILD_ID failed" -f content="$payload" -f sha="$sha" -f branch=main >/dev/null || true
          fi
