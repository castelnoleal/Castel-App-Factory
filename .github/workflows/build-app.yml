name: Build Generated App

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Build ID stored under build-inputs/<id>
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout factory
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Show source revision
        run: git rev-parse HEAD
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools emulator'
      - name: Install Android API 36
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Fetch build manifest and source chunks
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          mkdir -p "build-inputs/${BUILD_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/manifest.json?ref=build-${BUILD_ID}" --jq .content | tr -d '\n' | base64 -d > "build-inputs/${BUILD_ID}/manifest.json"
          chunk_count=$(jq -r '.sourceChunkCount // 0' "build-inputs/${BUILD_ID}/manifest.json")
          : > "build-inputs/${BUILD_ID}/source.bin"
          if [ "$chunk_count" -gt 0 ]; then
            for ((i=0; i<chunk_count; i++)); do
              name=$(printf 'source-%04d.bin' "$i")
              gh api "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/${name}?ref=build-${BUILD_ID}" --jq .content | tr -d '\n' | base64 -d >> "build-inputs/${BUILD_ID}/source.bin"
            done
          fi
          icon_chunk_count=$(jq -r '.iconChunkCount // 0' "build-inputs/${BUILD_ID}/manifest.json")
          : > "build-inputs/${BUILD_ID}/icon.bin"
          if [ "$icon_chunk_count" -gt 0 ]; then
            for ((i=0; i<icon_chunk_count; i++)); do
              name=$(printf 'icon-%04d.bin' "$i")
              gh api "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/${name}?ref=build-${BUILD_ID}" --jq .content | tr -d '\n' | base64 -d >> "build-inputs/${BUILD_ID}/icon.bin"
            done
          fi
      - name: Mark build running
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json?ref=build-${BUILD_ID}" --jq .sha)
          payload=$(jq -n --arg id "$BUILD_ID" --argjson runId "$GITHUB_RUN_ID" --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{buildId:$id,status:"running",runId:$runId,runUrl:$runUrl,updatedAt:(now|todateiso8601)}' | base64 -w0)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json" -f message="Mark build $BUILD_ID running" -f content="$payload" -f sha="$sha" -f branch="build-${BUILD_ID}" >/dev/null
      - name: "Update stage: generating Android project"
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json?ref=build-${BUILD_ID}" --jq .sha)
          payload=$(jq -n --arg id "${BUILD_ID}" --arg status "running" --arg message "Generating Android project" --argjson progress 20 --argjson runId "${GITHUB_RUN_ID}" --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{buildId:$id,status:$status,message:$message,progress:$progress,runId:$runId,runUrl:$runUrl,updatedAt:(now|todateiso8601)}' | base64 -w0)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json" -f message="Build ${BUILD_ID}: Generating Android project" -f content="${payload}" -f sha="${sha}" -f branch="build-${BUILD_ID}" >/dev/null

      - name: Install image asset tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Generate Android project
        env:
          BUILD_ID: ${{ inputs.build_id }}
          BUILD_MANIFEST: build-inputs/${{ inputs.build_id }}/manifest.json
          BUILD_OUTPUT: generated-app
          SOURCE_FILE: ''
          ICON_FILE: ''
        run: |
          set -euo pipefail
          if test -s "build-inputs/${BUILD_ID}/source.bin"; then export SOURCE_FILE="build-inputs/${BUILD_ID}/source.bin"; fi
          if test -s "build-inputs/${BUILD_ID}/icon.bin"; then export ICON_FILE="build-inputs/${BUILD_ID}/icon.bin"; fi
          python3 scripts/generate-app.py
      - name: Validate generated project
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          test -f generated-app/settings.gradle
          test -f generated-app/app/build.gradle
          test -f generated-app/app/src/main/AndroidManifest.xml
          find generated-app/app/src/main/java -name MainActivity.java -print -quit | grep -q MainActivity.java
          if grep -R -n 'com.castel.generatedapp' generated-app/app/src/main/java; then echo 'Template package leaked into generated source'; exit 1; fi
          if ! grep -R -n "applicationId '$(jq -r .packageName build-inputs/${BUILD_ID}/manifest.json)'" generated-app/app/build.gradle; then echo 'Generated applicationId does not match manifest'; exit 1; fi
      - name: Verify website target for HTTPS builds
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          source_mode=$(jq -r '.sourceMode // ""' "build-inputs/${BUILD_ID}/manifest.json")
          source_type=$(jq -r '.sourceType // ""' "build-inputs/${BUILD_ID}/manifest.json" | tr '[:upper:]' '[:lower:]')
          is_website=false
          if [ "$source_mode" = "website" ]; then
            is_website=true
          else
            case "$source_type" in
              website|website_url|https_website|https_website_url|http_website|http_website_url|web|url) is_website=true ;;
            esac
          fi
          if [ "$is_website" = true ]; then
            url=$(jq -r '.sourceUrl // ""' "build-inputs/${BUILD_ID}/manifest.json")
            test -n "$url"
            if ! grep -R -F "webView.loadUrl(\"${url}\");" generated-app/app/src/main/java >/dev/null && ! grep -R -F "webView.post(() -> webView.loadUrl(\"${url}\"));" generated-app/app/src/main/java >/dev/null; then echo "Generated website target does not match the supplied URL"; exit 1; fi
            if grep -R -F 'webView.loadUrl("https://appassets.androidplatform.net/assets/index.html")' generated-app/app/src/main/java >/dev/null || grep -R -F 'webView.post(() -> webView.loadUrl("https://appassets.androidplatform.net/assets/index.html"));' generated-app/app/src/main/java >/dev/null; then echo "Website build still points at local template asset"; exit 1; fi
          else
            test -s generated-app/app/src/main/assets/index.html
          fi
      - name: Verify generated app icon assets
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          icon_chunks=$(jq -r '.iconChunkCount // 0' "build-inputs/${BUILD_ID}/manifest.json")
          if [ "$icon_chunks" -gt 0 ]; then
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              test -s "generated-app/app/src/main/res/mipmap-${density}/ic_launcher.png"
              test -s "generated-app/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
            done
            test -s generated-app/app/src/main/res/drawable-nodpi/app_icon.png
            test ! -e generated-app/app/src/main/res/mipmap-anydpi/ic_launcher.xml
            test ! -e generated-app/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
            test -f generated-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            test -f generated-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
            grep -F '<background android:drawable="@android:color/transparent"' generated-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            grep -F '<foreground android:drawable="@drawable/ic_launcher_foreground"' generated-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            test -f generated-app/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
            identify -format '%[channels]' generated-app/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png | grep -E 'a|A'
            file generated-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png | grep -qi 'PNG image'
            identify -format '%[channels]' generated-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png | grep -qi 'a'
            identify -format '%[channels]' generated-app/app/src/main/res/drawable-nodpi/app_icon.png | grep -qi 'a'
          fi

      - name: "Update stage: compiling APK and AAB"
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json?ref=build-${BUILD_ID}" --jq .sha)
          payload=$(jq -n --arg id "${BUILD_ID}" --arg status "running" --arg message "Compiling APK and AAB" --argjson progress 45 --argjson runId "${GITHUB_RUN_ID}" --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{buildId:$id,status:$status,message:$message,progress:$progress,runId:$runId,runUrl:$runUrl,updatedAt:(now|todateiso8601)}' | base64 -w0)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json" -f message="Build ${BUILD_ID}: Compiling APK and AAB" -f content="${payload}" -f sha="${sha}" -f branch="build-${BUILD_ID}" >/dev/null

      - name: Determine release signing mode
        id: signing_gate
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          enabled=$(jq -r '.signing // false' "build-inputs/${BUILD_ID}/manifest.json")
          if [ "$enabled" != "true" ]; then enabled=false; fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Configure Play release signing
        if: steps.signing_gate.outputs.enabled == 'true'
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.CASTEL_RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.CASTEL_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.CASTEL_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.CASTEL_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_B64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/castel-signing"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/castel-signing/upload-key.jks"
          chmod 600 "$RUNNER_TEMP/castel-signing/upload-key.jks"
          echo "CASTEL_RELEASE_STORE_FILE=$RUNNER_TEMP/castel-signing/upload-key.jks" >> "$GITHUB_ENV"
          echo "CASTEL_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CASTEL_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          # Validate that the configured password can actually unlock the private key.
          # If this keystore intentionally uses one password for both store and key,
          # automatically fall back to the store password.
          if ! keytool -certreq -keystore "$RUNNER_TEMP/castel-signing/upload-key.jks" -storepass "$RELEASE_STORE_PASSWORD" -keypass "$RELEASE_KEY_PASSWORD" -alias "$RELEASE_KEY_ALIAS" -file "$RUNNER_TEMP/castel-signing/key-check.csr" >/dev/null 2>&1; then
            if keytool -certreq -keystore "$RUNNER_TEMP/castel-signing/upload-key.jks" -storepass "$RELEASE_STORE_PASSWORD" -keypass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" -file "$RUNNER_TEMP/castel-signing/key-check-storepass.csr" >/dev/null 2>&1; then
              echo "Configured key password did not unlock the private key; using the store password because this keystore uses one password for both."
              RELEASE_KEY_PASSWORD="$RELEASE_STORE_PASSWORD"
            else
              echo "Release signing credentials are invalid: the keystore opens, but the configured key password cannot unlock alias '$RELEASE_KEY_ALIAS'."
              echo "Update CASTEL_RELEASE_KEY_PASSWORD in GitHub Actions Secrets with the private-key password for this alias. Do not replace the keystore."
              exit 1
            fi
          fi
          rm -f "$RUNNER_TEMP/castel-signing/key-check.csr" "$RUNNER_TEMP/castel-signing/key-check-storepass.csr"
          echo "CASTEL_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$RUNNER_TEMP/castel-signing/upload-key.jks" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/tmp/castel-keystore-info.txt
          grep -E 'Alias name:|Valid from:|SHA256:' /tmp/castel-keystore-info.txt | head -n 3
          # keytool omits the keystore header when -alias is supplied, so
          # query the store type separately without an alias.
          keytool -list -keystore "$RUNNER_TEMP/castel-signing/upload-key.jks" -storepass "$RELEASE_STORE_PASSWORD" >/tmp/castel-keystore-type.txt
          store_type=$(awk -F': ' '/^Keystore type:/{print $2; exit}' /tmp/castel-keystore-type.txt)
          case "$store_type" in
            JKS|PKCS12) ;;
            *) echo "Unsupported release keystore type: $store_type"; exit 1 ;;
          esac
          # PKCS12 stores use the store password to protect private keys.
          # Normalize the Gradle key password to the store password to avoid
          # Android Gradle signing failures when a different key password was supplied.
          if [ "$store_type" = "PKCS12" ]; then
            RELEASE_KEY_PASSWORD="$RELEASE_STORE_PASSWORD"
            echo "CASTEL_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "PKCS12 detected; using the keystore password for the private key."
          fi
          echo "CASTEL_RELEASE_STORE_TYPE=$store_type" >> "$GITHUB_ENV"
          echo "Release keystore type detected: $store_type"

      - name: Lint and build debug APK + release AAB
        run: |
          set -euo pipefail
          gradle -p generated-app lintDebug assembleDebug bundleRelease --no-daemon --stacktrace
      - name: "Update stage: runtime smoke test"
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json?ref=build-${BUILD_ID}" --jq .sha)
          payload=$(jq -n --arg id "${BUILD_ID}" --arg status "running" --arg message "Starting Android emulator runtime test" --argjson progress 78 --argjson runId "${GITHUB_RUN_ID}" --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{buildId:$id,status:$status,message:$message,progress:$progress,runId:$runId,runUrl:$runUrl,updatedAt:(now|todateiso8601)}' | base64 -w0)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json" -f message="Build ${BUILD_ID}: Starting Android emulator runtime test" -f content="${payload}" -f sha="${sha}" -f branch="build-${BUILD_ID}" >/dev/null

      - name: Runtime smoke test generated APK
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BUILD_ID: ${{ inputs.build_id }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 1200
          ram-size: 2048M
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim -camera-back none
          # Do not use the action's disable-animations hook: it issues extra adb
          # settings commands immediately after boot, which intermittently fail
          # with Broken pipe on the hosted emulator even when Android has booted.
          script: |
            set -eu
            sleep 15
            adb shell cmd package list packages >/dev/null 2>&1 || sleep 20
            adb install -r generated-app/app/build/outputs/apk/debug/app-debug.apk || (adb kill-server; adb start-server; adb wait-for-device; sleep 15; adb install -r generated-app/app/build/outputs/apk/debug/app-debug.apk)
            adb logcat -c
            adb shell am force-stop "$(jq -r '.packageName' "build-inputs/${BUILD_ID}/manifest.json")" || true
            adb shell am start -n "$(jq -r '.packageName' "build-inputs/${BUILD_ID}/manifest.json")/.MainActivity"
            sleep 10
            adb logcat -d > /tmp/castel-runtime.log || true
            if grep -E "FATAL EXCEPTION|Process: $(jq -r '.packageName' "build-inputs/${BUILD_ID}/manifest.json")" /tmp/castel-runtime.log >/dev/null 2>&1; then echo "Runtime crash detected after launch."; tail -n 300 /tmp/castel-runtime.log; exit 1; fi
            adb shell dumpsys activity activities | grep -F "$(jq -r '.packageName' "build-inputs/${BUILD_ID}/manifest.json")/.MainActivity" >/dev/null
            adb shell pidof "$(jq -r '.packageName' "build-inputs/${BUILD_ID}/manifest.json")" >/dev/null || adb shell dumpsys activity activities | grep -F "$(jq -r '.packageName' "build-inputs/${BUILD_ID}/manifest.json")" >/dev/null
            echo "Runtime smoke test passed."

      - name: "Update stage: verifying artifacts"
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json?ref=build-${BUILD_ID}" --jq .sha)
          payload=$(jq -n --arg id "${BUILD_ID}" --arg status "running" --arg message "Verifying generated APK and AAB" --argjson progress 92 --argjson runId "${GITHUB_RUN_ID}" --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{buildId:$id,status:$status,message:$message,progress:$progress,runId:$runId,runUrl:$runUrl,updatedAt:(now|todateiso8601)}' | base64 -w0)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json" -f message="Build ${BUILD_ID}: Verifying generated APK and AAB" -f content="${payload}" -f sha="${sha}" -f branch="build-${BUILD_ID}" >/dev/null

      - name: Verify artifacts and apply app-specific filenames
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          APK=generated-app/app/build/outputs/apk/debug/app-debug.apk
          AAB=generated-app/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          if [ "$(jq -r '.signing // false' "build-inputs/${BUILD_ID}/manifest.json")" = "true" ]; then
            jarsigner -verify "$AAB" >/tmp/castel-aab-signature.txt 2>&1
            grep -q "jar verified" /tmp/castel-aab-signature.txt
            echo "Release AAB signature verification passed."
          fi
          app_name=$(jq -r '.appName' "build-inputs/${BUILD_ID}/manifest.json")
          safe_name=$(printf '%s' "$app_name" | sed 's/[^A-Za-z0-9._ -]/_/g; s/^[ ._-]*//; s/[ ._-]*$//')
          test -n "$safe_name"
          APK_NAMED="generated-app/app/build/outputs/apk/debug/${safe_name}.apk"
          AAB_NAMED="generated-app/app/build/outputs/bundle/release/${safe_name}.aab"
          cp "$APK" "$APK_NAMED"
          cp "$AAB" "$AAB_NAMED"
          echo "APK_NAMED=$APK_NAMED" >> "$GITHUB_ENV"
          echo "AAB_NAMED=$AAB_NAMED" >> "$GITHUB_ENV"
          echo "APK_FILENAME=${safe_name}.apk" >> "$GITHUB_ENV"
          echo "AAB_FILENAME=${safe_name}.aab" >> "$GITHUB_ENV"
          sha256sum "$APK_NAMED" "$AAB_NAMED"
      - name: Upload private artifacts to Cloudflare R2 when configured
        if: success()
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
          BUILD_ID: ${{ inputs.build_id }}
          APK_NAMED: ${{ env.APK_NAMED }}
          AAB_NAMED: ${{ env.AAB_NAMED }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCESS_KEY_ID}" ] || [ -z "${R2_SECRET_ACCESS_KEY}" ] || [ -z "${R2_ACCOUNT_ID}" ] || [ -z "${R2_BUCKET}" ]; then
            echo "R2 secrets are not configured; keeping legacy GitHub Release delivery for this sandbox test."
            exit 0
          fi
          python3 -m pip install --user awscli
          export PATH="$HOME/.local/bin:$PATH"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="auto"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws --endpoint-url "$endpoint" s3 cp "$APK_NAMED" "s3://${R2_BUCKET}/builds/${BUILD_ID}/apk.apk" --content-type application/vnd.android.package-archive --metadata "fileName=$(basename "$APK_NAMED")"
          aws --endpoint-url "$endpoint" s3 cp "$AAB_NAMED" "s3://${R2_BUCKET}/builds/${BUILD_ID}/aab.aab" --content-type application/octet-stream --metadata "fileName=$(basename "$AAB_NAMED")"
          echo "Private R2 artifact upload completed for build $BUILD_ID."
      - name: Upload generated artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_id }}
          if-no-files-found: error
          path: |
            ${{ env.APK_NAMED }}
            ${{ env.AAB_NAMED }}
            generated-app/app/build/reports/lint-results-debug.html
      - name: Publish test build to public release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          if [ "$(jq -r '.testBuild // false' "build-inputs/${BUILD_ID}/manifest.json")" != "true" ]; then exit 0; fi
          if ! gh release view test-latest >/dev/null 2>&1; then
            gh release create test-latest --target main --title "Castel App Factory Test APK" --notes "Latest installable test APK generated by Castel App Factory."
          fi
          cp "$APK_NAMED" "generated-app/app/build/outputs/apk/debug/Castel-App-Factory-Test.apk"
          cp "$AAB_NAMED" "generated-app/app/build/outputs/bundle/release/Castel-App-Factory-Test.aab"
          gh release upload test-latest generated-app/app/build/outputs/apk/debug/Castel-App-Factory-Test.apk generated-app/app/build/outputs/bundle/release/Castel-App-Factory-Test.aab --clobber
      - name: Publish individual build release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          tag="build-${BUILD_ID}"
          gh release create "$tag" --target main --title "Castel App Factory Build ${BUILD_ID}" --notes "Generated by Castel App Factory." "$APK_NAMED#${APK_FILENAME}" "$AAB_NAMED#${AAB_FILENAME}"
      - name: Mark build successful with direct download metadata
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          artifact_name="app-${BUILD_ID}"
          artifact=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" | jq --arg name "$artifact_name" '.artifacts | map(select(.name == $name)) | .[0]')
          artifact_id=$(echo "$artifact" | jq -r '.id')
          test "$artifact_id" != "null"
          artifact_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${artifact_id}"
          build_apk_url="https://castel-app-factory-api.nolealtohka.workers.dev/download/${BUILD_ID}/apk"
          build_aab_url="https://castel-app-factory-api.nolealtohka.workers.dev/download/${BUILD_ID}/aab"
          test_build=$(jq -r '.testBuild // false' "build-inputs/${BUILD_ID}/manifest.json")
          signing=$(jq -r '.signing // false' "build-inputs/${BUILD_ID}/manifest.json")
          test_apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/test-latest/Castel-App-Factory-Test.apk"
          test_aab_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/test-latest/Castel-App-Factory-Test.aab"
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json?ref=build-${BUILD_ID}" --jq .sha)
          app_name=$(jq -r '.appName' "build-inputs/${BUILD_ID}/manifest.json")
          safe_name=$(printf '%s' "$app_name" | sed 's/[^A-Za-z0-9._ -]/_/g; s/^[ ._-]*//; s/[ ._-]*$//')
          payload=$(jq -n --arg id "$BUILD_ID" --argjson runId "$GITHUB_RUN_ID" --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg artifactUrl "$artifact_url" --arg buildApkUrl "$build_apk_url" --arg buildAabUrl "$build_aab_url" --argjson artifactId "$artifact_id" --arg testApkUrl "$test_apk_url" --arg testAabUrl "$test_aab_url" --argjson testBuild "$test_build" --argjson signing "$signing" --arg apkName "${safe_name}.apk" --arg aabName "${safe_name}.aab" '{buildId:$id,status:"success",runId:$runId,runUrl:$runUrl,artifactId:$artifactId,artifactUrl:$artifactUrl,buildApkUrl:$buildApkUrl,buildAabUrl:$buildAabUrl,testBuild:$testBuild,signing:$signing,testApkUrl:(if $testBuild then $testApkUrl else null end),testAabUrl:(if $testBuild then $testAabUrl else null end),apk:$apkName,aab:$aabName,updatedAt:(now|todateiso8601)}' | base64 -w0)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json" -f message="Build $BUILD_ID succeeded" -f content="$payload" -f sha="$sha" -f branch="build-${BUILD_ID}" >/dev/null
      - name: Replace previous app build release after successful update
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          previous_id=$(jq -r '.previousBuildId // ""' "build-inputs/${BUILD_ID}/manifest.json")
          if [[ "$previous_id" =~ ^[0-9a-fA-F-]{36}$ ]] && [ "$previous_id" != "$BUILD_ID" ]; then
            # Only remove the prior release after this update has built, passed tests,
            # and its replacement release/status have been published successfully.
            gh release delete "build-${previous_id}" --yes --cleanup-tag >/dev/null 2>&1 || true
          fi
      - name: Mark build failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json?ref=build-${BUILD_ID}" --jq .sha || true)
          if [ -n "$sha" ]; then
            payload=$(jq -n --arg id "$BUILD_ID" --argjson runId "$GITHUB_RUN_ID" --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{buildId:$id,status:"failed",runId:$runId,runUrl:$runUrl,updatedAt:(now|todateiso8601)}' | base64 -w0)
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json" -f message="Build $BUILD_ID failed" -f content="$payload" -f sha="$sha" -f branch="build-${BUILD_ID}" >/dev/null || true
          fi
