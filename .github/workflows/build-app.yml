name: Build Generated App

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Build ID stored under build-inputs/<id>
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout factory
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Fetch build manifest and source chunks
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          mkdir -p "build-inputs/${BUILD_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/manifest.json?ref=main" --jq .content | tr -d '\n' | base64 -d > "build-inputs/${BUILD_ID}/manifest.json"
          chunk_count=$(jq -r '.sourceChunkCount // 0' "build-inputs/${BUILD_ID}/manifest.json")
          : > "build-inputs/${BUILD_ID}/source.bin"
          if [ "$chunk_count" -gt 0 ]; then
            for ((i=0; i<chunk_count; i++)); do
              name=$(printf 'source-%04d.bin' "$i")
              gh api "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/${name}?ref=main" --jq .content | tr -d '\n' | base64 -d >> "build-inputs/${BUILD_ID}/source.bin"
            done
          fi

      - name: Mark build running
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json?ref=main" --jq .sha)
          payload=$(jq -n --arg id "$BUILD_ID" --argjson runId "$GITHUB_RUN_ID" --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{buildId:$id,status:"running",runId:$runId,runUrl:$runUrl,updatedAt:(now|todateiso8601)}' | base64 -w0)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json" -f message="Mark build $BUILD_ID running" -f content="$payload" -f sha="$sha" -f branch=main >/dev/null

      - name: Generate Android project
        env:
          BUILD_ID: ${{ inputs.build_id }}
          BUILD_MANIFEST: build-inputs/${{ inputs.build_id }}/manifest.json
          BUILD_OUTPUT: generated-app
          SOURCE_BASE64: ''
        run: |
          set -euo pipefail
          if test -s "build-inputs/${BUILD_ID}/source.bin"; then
            export SOURCE_BASE64="$(base64 -w0 "build-inputs/${BUILD_ID}/source.bin")"
          fi
          python3 scripts/generate-app.py

      - name: Validate generated project
        run: |
          set -euo pipefail
          test -f generated-app/settings.gradle
          test -f generated-app/app/build.gradle
          test -f generated-app/app/src/main/AndroidManifest.xml
          find generated-app/app/src/main/java -name MainActivity.java -print -quit | grep -q MainActivity.java
          if grep -R -n 'com.castel.generatedapp' generated-app/app/src/main/java; then
            echo 'Template package leaked into generated source'
            exit 1
          fi
          if ! grep -R -n "applicationId '$(jq -r .packageName build-inputs/${BUILD_ID}/manifest.json)'" generated-app/app/build.gradle; then
            echo 'Generated applicationId does not match manifest'
            exit 1
          fi

      - name: Lint and build debug APK + release AAB
        run: |
          set -euo pipefail
          gradle -p generated-app lintDebug assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Verify artifacts
        run: |
          set -euo pipefail
          test -s generated-app/app/build/outputs/apk/debug/app-debug.apk
          test -s generated-app/app/build/outputs/bundle/release/app-release.aab
          unzip -t generated-app/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -t generated-app/app/build/outputs/bundle/release/app-release.aab >/dev/null
          echo 'Generated APK and AAB passed artifact integrity checks.'

      - name: Upload generated artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_id }}
          if-no-files-found: error
          path: |
            generated-app/app/build/outputs/apk/debug/app-debug.apk
            generated-app/app/build/outputs/bundle/release/app-release.aab
            generated-app/app/build/reports/lint-results-debug.html

      - name: Mark build successful with artifact metadata
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          artifact=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts | map(select(.name == "app-'"$BUILD_ID"'")) | .[0]')
          artifact_id=$(echo "$artifact" | jq -r '.id')
          artifact_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${artifact_id}"
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json?ref=main" --jq .sha)
          payload=$(jq -n --arg id "$BUILD_ID" --argjson runId "$GITHUB_RUN_ID" --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --arg artifactUrl "$artifact_url" --argjson artifactId "$artifact_id" '{buildId:$id,status:"success",runId:$runId,runUrl:$runUrl,artifactId:$artifactId,artifactUrl:$artifactUrl,apk:"app-debug.apk",aab:"app-release.aab",updatedAt:(now|todateiso8601)}' | base64 -w0)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json" -f message="Build $BUILD_ID succeeded" -f content="$payload" -f sha="$sha" -f branch=main >/dev/null

      - name: Mark build failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json?ref=main" --jq .sha || true)
          if [ -n "$sha" ]; then
            payload=$(jq -n --arg id "$BUILD_ID" --argjson runId "$GITHUB_RUN_ID" --arg runUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{buildId:$id,status:"failed",runId:$runId,runUrl:$runUrl,updatedAt:(now|todateiso8601)}' | base64 -w0)
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/status.json" -f message="Build $BUILD_ID failed" -f content="$payload" -f sha="$sha" -f branch=main >/dev/null || true
          fi
