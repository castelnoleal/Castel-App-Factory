name: Build Generated App

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Build ID stored under build-inputs/<id>
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout factory
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Fetch build manifest
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          mkdir -p build-inputs/${BUILD_ID}
          gh api repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/manifest.json --jq .content | tr -d '\n' | base64 -d > build-inputs/${BUILD_ID}/manifest.json
          if gh api repos/${GITHUB_REPOSITORY}/contents/build-inputs/${BUILD_ID}/source.bin >/tmp/source.json 2>/dev/null; then
            jq -r .content /tmp/source.json | tr -d '\n' | base64 -d > build-inputs/${BUILD_ID}/source.bin
          fi

      - name: Generate Android project
        env:
          BUILD_ID: ${{ inputs.build_id }}
          BUILD_MANIFEST: build-inputs/${{ inputs.build_id }}/manifest.json
          SOURCE_BASE64: ''
        run: |
          set -euo pipefail
          if test -f "build-inputs/${BUILD_ID}/source.bin"; then
            export SOURCE_BASE64="$(base64 -w0 "build-inputs/${BUILD_ID}/source.bin")"
          fi
          python3 scripts/generate-app.py

      - name: Validate generated project
        run: |
          set -euo pipefail
          test -f generated-app/settings.gradle
          test -f generated-app/app/build.gradle
          test -f generated-app/app/src/main/AndroidManifest.xml
          find generated-app/app/src/main/java -name MainActivity.java -print -quit | grep -q MainActivity.java
          if ! grep -R 'com.castel.generatedapp' generated-app/app/src/main/java; then true; else echo 'Template package leaked into generated source'; exit 1; fi

      - name: Lint and build debug APK + release AAB
        run: |
          set -euo pipefail
          gradle -p generated-app lintDebug assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Verify artifacts
        run: |
          set -euo pipefail
          test -s generated-app/app/build/outputs/apk/debug/app-debug.apk
          test -s generated-app/app/build/outputs/bundle/release/app-release.aab
          unzip -t generated-app/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -t generated-app/app/build/outputs/bundle/release/app-release.aab >/dev/null
          echo 'Generated APK and AAB passed artifact integrity checks.'

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_id }}
          if-no-files-found: error
          path: |
            generated-app/app/build/outputs/apk/debug/app-debug.apk
            generated-app/app/build/outputs/bundle/release/app-release.aab
            generated-app/app/build/reports/lint-results-debug.html
