# Standalone: runs on every change to this file on branch synapse-android.
# Builds a separate app ("EDOPro Synapse Offline", io.github.edo9300.edopro.synapse.offline) whose
# AI bots run the Synapse model on the phone itself (no PC, no network).
# The fork's own build.yml needs Project Ignis' secrets and can be disabled.
