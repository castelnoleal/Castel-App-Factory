      - name: WindBot Ignite + Synapse patch
        run: |
          git clone --depth 1 https://github.com/ProjectIgnis/windbot.git windbot
          python3 synapse/tools/patch_windbot.py windbot

      - name: Build libWindbot.aar with Project Ignis' builder image
        working-directory: windbot
        run: |
          docker pull ghcr.io/projectignis/mono_xamarin_builder_monodroid:master
          docker image tag ghcr.io/projectignis/mono_xamarin_builder_monodroid:master monodroid
          docker run --rm --volume "$PWD:/project" monodroid -t:restore -p:RestorePackagesPath=./.nuget WindBot.sln
          sudo chown -R "$(id -u):$(id -g)" .
          ./ci/install-patched-mono-runtime.sh
          docker run --rm --volume "$PWD:/project" monodroid -m -p:Configuration=Release WindBot.sln -p:Posix=true
          sudo chown -R "$(id -u):$(id -g)" .
          ls -la output/libWindbot.aar

      - name: Hand over to the APK job
        run: |
          tar -czf inputs.tgz synapse windbot/output/libWindbot.aar windbot/bots.json windbot/Decks windbot/Dialogs windbot/COPYING
      - uses: actions/upload-artifact@v4
        with:
          name: synapse-build-inputs
          path: inputs.tgz
          retention-days: 3

  apk:
    name: EDOPro Synapse Offline APK
    needs: libwindbot
    runs-on: ubuntu-24.04
    env:
      OS_NAME: linux
      USE_BUNDLED_FONT: 1
      SERVER_URL: local
      SERVER_TOKEN: ""
      META_DECKS: "8"
    steps:
      - name: edopro-android source
        run: git clone -q --depth 1 --recurse-submodules --shallow-submodules https://github.com/edo9300/edopro-android.git .

      - uses: actions/download-artifact@v4
        with:
          name: synapse-build-inputs

      - name: Synapse inputs
        run: |
          tar -xzf inputs.tgz
          mkdir -p libs
          cp windbot/output/libWindbot.aar libs/libWindbot.aar
          python3 synapse/android/patch_edopro_android.py . --variant offline
          sudo apt-get update -y && sudo apt-get install -y lua5.3 rsync

      - name: Decks for the Synapse bots
        run: |
          mkdir -p decks_all
          cp synapse/decks/*.ydk decks_all/ 2>/dev/null || true
          if [ "${META_DECKS:-0}" != "0" ]; then
            python3 synapse/training/fetch_meta_decks.py --out decks_meta --top "$META_DECKS" \
              && cp -n decks_meta/*.ydk decks_all/ || echo "::warning::could not download meta decks"
          fi
          ls decks_all
          [ -n "$(ls decks_all)" ] || { echo "::error::no decks: bundle some with make_workflow.py --decks or set meta_decks > 0"; exit 1; }

      - name: SDK, signing key
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "keystore=$PWD/synapse/android/synapse-release.jks" >> local.properties
          echo "keystore.password=$(cat synapse/android/synapse-release.pass)" >> local.properties
          echo "key=synapse" >> local.properties
          echo "key.password=$(cat synapse/android/synapse-release.pass)" >> local.properties
          echo "org.gradle.jvmargs=-Xmx8192M" >> gradle.properties

      - name: Prepare assets (font)
        run: ./ci/touch-assets.sh

      - name: Build native client (NDK)
        run: ./ci/build-android.sh

      - name: On-device model
        run: |
          pip install -q --break-system-packages msgpack numpy 2>/dev/null || pip install -q msgpack numpy
          if [ -f synapse/model/synapse_model.bin ]; then
            cp synapse/model/synapse_model.bin synapse_model.bin
          else
            curl -sSL -o base.flax_model https://github.com/sbl1996/ygo-agent/releases/download/v0.1/0546_22750M.flax_model
            curl -sSL -o base_codes.txt https://raw.githubusercontent.com/sbl1996/ygo-agent/dd4af63/scripts/code_list.txt
            python3 synapse/tools/export_model.py --ckpt base.flax_model --code-list base_codes.txt --out synapse_model.bin
          fi
          ls -la synapse_model.bin

      - name: Game data + Synapse bots
        run: bash synapse/android/prepare_assets.sh . windbot decks_all "$SERVER_URL" "$SERVER_TOKEN" "$PWD/synapse_model.bin"

      - name: Build APK
        run: |
          ./gradlew assembleRelease --no-daemon
          mkdir -p out
          cp "$(ls build/outputs/apk/release/*.apk | head -1)" out/EDOPro-Synapse-Offline.apk
          ls -la out

      - name: Check the APK
        run: |
          APK=out/EDOPro-Synapse-Offline.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          note() { echo "$1"; echo "::notice title=$2::$1"; }
          note "$("$BT/aapt" dump badging "$APK" | grep -E "^package:|^application-label:|^native-code:" | tr '\n' ' ')" "package"
          note "$("$BT/apksigner" verify --print-certs "$APK" | grep -i "SHA-256" | head -1)" "signature"
          note "$(unzip -l "$APK" | grep -cE 'lib/arm64-v8a/.*\.so') native libs; $(unzip -l "$APK" | grep -oE 'assets/defaults/libocgcore[a-z0-9]*\.so' | tr '\n' ' ')" "native"
          note "$(unzip -p "$APK" assets/defaults/WindBot/synapse.json | tr -d '\n ' | sed 's/"token":"[^"]*"/"token":"(set)"/')" "synapse.json"
          note "$(unzip -p "$APK" assets/defaults/WindBot/bots.json | grep -o '"Synapse: [^"]*"' | tr '\n' ' ')" "bots"
          note "$(unzip -l "$APK" | tail -1)" "size"
          note "$(unzip -l "$APK" | grep -E 'synapse_model.bin' | awk '{print $1" bytes "$4}' || true)" "on-device model"
          unzip -p "$APK" 'lib/arm64-v8a/libmonodroid*.so' >/dev/null 2>&1 || true
          note "$(unzip -l "$APK" | grep -ciE 'assemblies/.*(WindBot|ExecutorBase)|libWindbot|windbot' ) windbot entries" "windbot"

      - uses: actions/upload-artifact@v4
        with:
          name: EDOPro-Synapse-Offline
          path: out/EDOPro-Synapse-Offline.apk
