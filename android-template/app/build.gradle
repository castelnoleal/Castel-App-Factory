// Signing acceptance verification is maintained in release-signing-test.yml.
plugins { id 'com.android.application' }

def releaseStoreFile = System.getenv("CASTEL_RELEASE_STORE_FILE")
def releaseStorePassword = System.getenv("CASTEL_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("CASTEL_RELEASE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("CASTEL_RELEASE_KEY_PASSWORD")
def releaseStoreType = System.getenv("CASTEL_RELEASE_STORE_TYPE")
def releaseSigningReady = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                if (releaseStoreType) {
                    storeType releaseStoreType
                }
            }
        }
    }
    namespace 'com.castel.generatedapp'
    compileSdk 36

    defaultConfig {
        applicationId 'com.castel.generatedapp'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.webkit:webkit:1.17.0'
}
