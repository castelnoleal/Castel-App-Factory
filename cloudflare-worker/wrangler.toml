name = "castel-app-factory-api-sandbox"
main = "worker.js"
compatibility_date = "2026-08-25"
workers_dev = true

[vars]
GITHUB_OWNER = "castelnoleal"
GITHUB_REPO = "Castel-App-Factory"
GITHUB_WORKFLOW = "build-app.yml"
GITHUB_BASE_BRANCH = "sandbox/private-downloads"
REQUIRE_PRIVATE_ARTIFACTS = "true"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "castel-app-factory-artifacts-sandbox"
